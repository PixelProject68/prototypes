<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F0F">
<link rel="icon" href="data:,">
<title>mooon, вид с места</title>
<link rel="stylesheet" href="m.css?v=1">
<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.bundle.js",
    "three/examples/jsm/geometries/RoundedBoxGeometry.js": "./js/vendor/three.bundle.js",
    "three/examples/jsm/utils/BufferGeometryUtils.js": "./js/vendor/three.bundle.js",
    "three/examples/jsm/lights/RectAreaLightUniformsLib.js": "./js/vendor/three.bundle.js",
    "three/examples/jsm/postprocessing/EffectComposer.js": "./js/vendor/three.bundle.js",
    "three/examples/jsm/postprocessing/RenderPass.js": "./js/vendor/three.bundle.js",
    "three/examples/jsm/postprocessing/UnrealBloomPass.js": "./js/vendor/three.bundle.js",
    "three/examples/jsm/postprocessing/OutputPass.js": "./js/vendor/three.bundle.js",
    "three/examples/jsm/environments/RoomEnvironment.js": "./js/vendor/three.bundle.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <div class="herobg"></div>
  <header>
    <button class="ib" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="htx"><b>Эбенезер</b><span>25.11, 19:00, Dana Mall</span></div>
    <div id="timer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span id="timerVal">05:00</span></div>
  </header>

  <div id="card"></div>
  <canvas id="gl"></canvas>
  <div id="map">
    <div class="hallname"><b>Зал 3 mooon+</b>11 рядов, 156 мест</div>
    <div id="screenArc"><svg viewBox="0 0 100 10" preserveAspectRatio="none"><path d="M0 9 Q50 -3 100 9" stroke="#fff" fill="none" vector-effect="non-scaling-stroke" style="stroke-width:3px;filter:drop-shadow(0 0 4px #fff)"/></svg><span>ЭКРАН</span></div>
    <div class="legend"><span><i class="lg-v"></i>Свободно</span><span><i class="lg-g"></i>Занято</span><span><i class="lg-o"></i>Выбрано</span></div>
  </div>

  <div id="sheet">
    <div id="picked"></div>
    <div class="promo" id="promo"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg></div><div class="tx"><b>Вид с места<span class="new">Новое</span></b><span>Как будет виден экран из вашего кресла</span></div><button id="preview" class="btn btn-g btn-s">Посмотреть</button></div>
    <div class="totalrow"><div class="sum"><small>Итого</small><b id="total"></b></div><button id="pay" class="btn btn-v">В корзину</button></div>
  </div>

  <div class="pov-ui">
    <div class="povtop">
      <button id="back" class="ib glass ia" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="povseat glass"><b id="povSeat"></b><div class="row"><span id="povState" class="state"></span><span id="povType"></span></div></div>
    </div>
    <div id="mySeats" class="ia"></div>
    <div class="lookhint glass"><svg id="hintIc" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V6.5a1.5 1.5 0 0 1 3 0V12m0-1.5v-6a1.5 1.5 0 0 1 3 0v6m0-1a1.5 1.5 0 0 1 3 0v2m0-1a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1.5a7 7 0 0 1-5.4-2.6L3 16.3a1.6 1.6 0 0 1 2.4-2.1L8 16.5"/></svg><span id="hintTx">Наклоните телефон или потяните</span></div>
    <div class="povpanel glass ia">
      <h4>Пересесть</h4><p>Нажмите на место, чтобы посмотреть оттуда</p>
      <div id="mini"></div>
      <div class="povbtns">
        <button id="toMap" class="btn btn-g">Схема зала</button>
        <button id="povAction" class="btn btn-v"></button>
      </div>
    </div>
  </div>
  <div id="toast">Прототип: здесь места уходят в корзину</div>
</div>
<script type="module" src="js/mobile.js?v=1"></script>
</body>
</html>
